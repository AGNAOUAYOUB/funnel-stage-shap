[project]
name = "funnel-shap"
version = "0.1.0"
description = "Dynamic Explainable AI for Sequential Purchase Prediction: A Funnel-Stage SHAP Framework"
authors = [{ name = "Ayoub Agnaou" }]
readme = "README.md"
requires-python = "==3.11.*"

# Version pins follow protocol Sec. 4.1. Upper bounds are deliberate: the freeze
# forbids "latest". requirements.lock holds the exact resolved set.
dependencies = [
    # dataframes
    "pandas>=2.2,<2.3",
    "pyarrow>=15,<19",
    "polars>=1.0,<2.0",
    "numpy>=1.26,<2.0",
    # classical ML
    "scikit-learn>=1.4,<1.5",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.0,<5.0",
    "catboost>=1.2,<1.3",
    "imbalanced-learn>=0.12,<0.13",
    # explainability
    "shap>=0.45,<0.46",
    # statistics
    "scipy>=1.13,<1.14",
    "statsmodels>=0.14,<0.15",
    "mlxtend>=0.23,<0.24",
    # tuning / tracking / config
    "optuna>=3.6,<4.0",
    "mlflow>=2.12,<3.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    # visualisation
    "matplotlib>=3.8,<3.10",
    "seaborn>=0.13,<0.14",
    # cli / io
    "typer>=0.12,<1.0",
    "tqdm>=4.66,<5.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
# Sequence arm (Sec. 9.3 / 11.2). Installed separately so the tabular arm stays
# CPU-only and quick to provision.
sequence = [
    "torch>=2.2,<3.0",
    "timeshap>=1.0",
]
# XAI evaluation layer (Sec. 11.3).
xai-eval = [
    "quantus>=0.5,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.4,<1.0",
    "black>=24.0,<26.0",
    "pre-commit>=3.7,<5.0",
    "dvc>=3.50,<4.0",
    "jupyterlab>=4.0,<5.0",
]

[project.scripts]
funnel-shap = "funnel_shap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel_shap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that take more than a few seconds",
    "needs_data: marks tests that require the raw datasets to be present",
]
